name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Prepare Android SDK (cmdline-tools + packages)
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDKROOT"
          # Ensure cmdline-tools latest exists in writable workspace
          if [ ! -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android cmdline-tools (latest) into $SDKROOT"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -qo /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDKROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools/* "$SDKROOT/cmdline-tools/latest/"
          fi
          export PATH="$SDKROOT/cmdline-tools/latest/bin:$SDKROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$SDKROOT" --licenses
          yes | sdkmanager --sdk_root="$SDKROOT" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
