name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      JAVA_OPTS: -Djava.net.preferIPv4Stack=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip curl wget

      - name: Prepare Android SDK (cmdline-tools + packages)
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDKROOT"
          retry() { n=0; until "$@"; do n=$((n+1)); if [ $n -ge 3 ]; then echo "command failed: $*"; return 1; fi; echo "retry $n: $*"; sleep 3; done }
          if [ ! -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android cmdline-tools (bootstrap)"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -qo /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDKROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools/* "$SDKROOT/cmdline-tools/latest/"
          fi
          export PATH="$SDKROOT/cmdline-tools/latest/bin:$SDKROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$SDKROOT" --licenses || true
          retry bash -lc "yes | sdkmanager --sdk_root=\"$SDKROOT\" --install \"platform-tools\""
          retry bash -lc "yes | sdkmanager --sdk_root=\"$SDKROOT\" --install \"platforms;android-34\""
          retry bash -lc "yes | sdkmanager --sdk_root=\"$SDKROOT\" --install \"build-tools;34.0.0\""
          ls -la "$SDKROOT" || true

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle --version

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradle-8.7/bin/gradle -g .gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
