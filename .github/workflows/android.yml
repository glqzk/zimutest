name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Android SDK (cmdline-tools + packages)
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDKROOT"
          # Ensure cmdline-tools latest exists
          if [ ! -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android cmdline-tools (latest)"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -qo /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDKROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools/* "$SDKROOT/cmdline-tools/latest/"
          fi
          yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
