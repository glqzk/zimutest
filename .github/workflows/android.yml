name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          YES_CMD="yes" 
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          # Try latest cmdline-tools first, then fallback to versioned path
          if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            $YES_CMD | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          elif [ -d "$SDKROOT/cmdline-tools" ]; then
            # Find any cmdline-tools/*/bin/sdkmanager
            for d in "$SDKROOT"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then
                $YES_CMD | "$d/sdkmanager" --licenses
                break
              fi
            done
          else
            # As a last resort, rely on PATH
            $YES_CMD | sdkmanager --licenses
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
